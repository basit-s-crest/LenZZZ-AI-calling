<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipecat AI Voice Agent Tester</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #2ea043;
      --red: #f85149;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #fff;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      background: #21262d;
      margin-bottom: 28px;
      border: 1px solid var(--border);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--text-muted);
      transition: background-color 0.3s;
    }
    .status-dot.active {
      background-color: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .status-dot.error {
      background-color: var(--red);
    }
    .visualizer-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      height: 60px;
      margin-bottom: 28px;
    }
    .bar {
      width: 6px;
      height: 12px;
      background: var(--accent);
      border-radius: 3px;
      transition: height 0.1s ease;
      opacity: 0.4;
    }
    .call-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background-color: var(--green);
      color: white;
      font-size: 28px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(46, 160, 67, 0.4);
    }
    .call-btn:hover {
      transform: scale(1.05);
    }
    .call-btn.in-call {
      background-color: var(--red);
      box-shadow: 0 4px 14px rgba(248, 81, 73, 0.4);
    }
    .btn-label {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .logs {
      margin-top: 24px;
      text-align: left;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 12px;
      font-family: monospace;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pipecat AI Voice Agent</h1>
    <p class="subtitle">Real-time STT (Deepgram) &bull; LLM (Groq) &bull; TTS</p>

    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Ready to connect</span>
    </div>

    <div class="visualizer-container" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div>
      <button id="callButton" class="call-btn" title="Start Call">
        <span id="callIcon">&#128222;</span>
      </button>
      <div id="callLabel" class="btn-label">Click to Start Call</div>
    </div>

    <div class="logs" id="logBox">
      [System] Ready. Click the call button to speak with the AI agent.
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
